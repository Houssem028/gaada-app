<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ڨعدة</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
}

.container{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:20px;
}


.logo{
    font-size:65px;
    font-weight:bold;
    color:#ff9800;
    margin-bottom:10px;
}


.slogan{
    font-size:20px;
    color:#ddd;
    margin-bottom:50px;
}


.btn{

    width:90%;
    max-width:350px;
    padding:18px;
    margin:10px;

    border:none;
    border-radius:25px;

    background:#ff9800;
    color:#111;

    font-size:22px;
    font-weight:bold;

    cursor:pointer;
}


.btn:hover{
    background:#ffc107;
}


.footer{
    position:absolute;
    bottom:20px;
    color:#777;
    font-size:14px;
}

</style>

</head>


<body>


<div class="container">


<div class="logo">
ڨعدة 🎮
</div>


<div class="slogan">
لمة صحابك... واللعب يبدأ
</div>


<button class="btn">
إنشاء قعدة
</button>


<button class="btn">
دخول بكود
</button>


<button class="btn">
الألعاب
</button>


<div class="footer">
Gaada © 2026
</div>


</div>


</body>

</html>

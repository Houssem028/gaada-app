<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>قعدة - ڨعدة</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<div class="logo">
ڨعدة 🎮
</div>



<h2 id="roomTitle">
☕ اسم القعدة
</h2>



<div id="roomCode">
🔑 الكود
</div>



<h3 id="playerCount">
👥 اللاعبين (0)
</h3>



<div id="players">
لا يوجد لاعبين بعد
</div>





<!-- تحكم الهوست فقط -->

<div id="hostControls" style="display:none;">


<button class="btn" onclick="showGames()">
🎮 اختيار اللعبة
</button>



<div id="gameMenu" style="display:none;">


<button class="btn" onclick="selectGame('تحديات وأسئلة')">
🧠 تحديات وأسئلة
</button>


<button class="btn" onclick="selectGame('تخمين اللاعبين')">
🎯 تخمين اللاعبين
</button>


<button class="btn" onclick="selectGame('أسئلة عامة')">
❓ أسئلة عامة
</button>


</div>



<button 
id="startGameBtn" 
class="btn" 
style="display:none;"
onclick="startGame()">

🚀 بدء اللعبة

</button>


</div>





<div id="gameInfo">

🎮 لم يتم اختيار لعبة بعد

</div>





<div id="waitingMessage">

</div>





<!-- الدردشة -->

<div class="chat-container">


<h3>
💬 دردشة القعدة
</h3>



<div id="messages" class="messages">

لا توجد رسائل بعد

</div>



<div class="chat-input">


<input

id="messageInput"

class="input"

placeholder="اكتب رسالة...">



<button class="btn" onclick="sendMessage()">

📩

</button>


</div>


</div>







<button class="btn" onclick="leaveRoom()">

🚪 خروج من القعدة

</button>





</div>



<script type="module" src="./room.js"></script>


</body>

</html>
